[package]
name = "reeve"
version = "0.4.0"
edition = "2021"
description = "Native PWA launcher with a shared runtime and capability-gated bridge"
license = "MIT"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
tao = "0.35"
wry = "0.55"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rfd = "0.15"
notify-rust = "4"
url = "2"
open = "5"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.21"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true